# A DOSBox config that runs an unattended build.
#
# EVERY PATH HERE IS ABSOLUTE. That is not style. DOSBox-X's working directory is not the directory you invoked it
# from, so a relative -conf path fails with "Can't open specified config file" and DOSBox-X then loads the DEFAULT
# config, which has no autoexec and no mount. The failure looks like "the compiler did not run" rather than "the
# config was never read", and it cost an afternoon.
#
# THE AUTOEXEC CALLS A .BAT RATHER THAN DOING THE WORK. Percent-sign substitution inside a DOSBox config is not
# reliable, and the config parser treats '%' specially in some versions. A BAT file has well-defined behaviour and
# can be edited without touching this file.
#
# memsize is generous because the High C optimiser is not small, and xms is required because the compiler is a
# DOS extender, so it will not start without extended memory.

[dosbox]
machine=svga_s3
memsize=32

[sdl]
fullscreen=false
windowresolution=800x600
output=surface

[dos]
xms=true
ems=false
umb=true

[cpu]
core=normal
cputype=386
cycles=max

[autoexec]
@echo off
mount c /work
c:
call BUILD.BAT
