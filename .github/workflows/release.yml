# Cut a release: a playable host binary, and the toolchain image on ghcr.io.
#
# WHAT MAY BE PUBLISHED, and what changed on 2026-10-30. The recompiled C++ is committed under module/, which means
# a playable u2port can be built by CI with no disc anywhere in the pipeline, and that is what the release ships.
# The half of the policy that did not move: the original media is never hosted, in git or in a release. Not
# ENCHANT.EXP, not the disc images, not the floppy, not a ROM, not one extracted asset. `tools/release-package.sh`
# enforces that by extension and by name, and the refusal was demonstrated rather than assumed.
#
# WHY THE IMAGE IS STILL PUBLISHED. It is the toolchain and the display, which is what makes the same commands work
# on a machine with no compiler of its own. It is also the from-source route, for whoever regenerates the module.
#
# TRIGGERS. A tag `v*` cuts a real release. `workflow_dispatch` runs the same build and pushes the image with a
# `dev-<sha>` tag, so the plumbing can be exercised without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish the port toolchain image
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the tags
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "tags<<TAGS"
              echo "ghcr.io/${GITHUB_REPOSITORY}:port-${GITHUB_REF_NAME}"
              echo "ghcr.io/${GITHUB_REPOSITORY}:port-latest"
              echo "TAGS"
              echo "latest=ghcr.io/${GITHUB_REPOSITORY}:port-latest"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<TAGS"
              echo "ghcr.io/${GITHUB_REPOSITORY}:dev-${GITHUB_SHA::7}"
              echo "TAGS"
              echo "latest=ghcr.io/${GITHUB_REPOSITORY}:dev-${GITHUB_SHA::7}"
            } >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Containerfile.x
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  host:
    name: Build the playable host binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The build happens in the image it ships from, for a glibc and libstdc++ baseline older than any current
      # desktop rather than the runner's own. SDL is no longer the reason: release-package.sh builds it static from
      # the pinned source, so the runner's missing libsdl3-dev stops mattering. No game file is anywhere in this job,
      # because the module is committed, and it refuses outright if anything game-shaped reaches staging.
      - name: Build and package
        run: |
          docker build -f container/Containerfile.x -t u2port-ci container/
          docker run --rm -v "$GITHUB_WORKSPACE:/work" --entrypoint bash u2port-ci \
            -lc 'cd /work && ./tools/release-package.sh'

      - name: Record the digest
        id: sum
        run: echo "sha256=$(sha256sum dist/u2port-linux-x86_64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: u2port-linux-x86_64
          path: dist/u2port-linux-x86_64

    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}

  windows:
    name: Build the Windows binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # mingw rather than a Windows runner, because the artefact is a static cross build and nothing about it needs
      # Windows to produce. The Windows runner would cost a different toolchain for the same bytes, and this job then
      # has one thing to install.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 cmake

      # SDL for Windows from the same pin and the same hash check as the Linux build, compiled once per pin.
      - name: Cache SDL3 built for Windows
        uses: actions/cache@v4
        with:
          path: build/sdl3-win
          key: sdl3-win-${{ hashFiles('tools/sdl-pin.txt') }}

      - name: Build and package
        run: ./tools/release-package-windows.sh

      - name: Record the digest
        id: sum
        run: echo "sha256=$(sha256sum dist/u2port-windows-x86_64.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: u2port-windows-x86_64.exe
          path: dist/u2port-windows-x86_64.exe

    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: [image, host, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: u2port-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: u2port-windows-x86_64.exe

      # Two binaries and nothing else. The rule this step enforces: a release publishes files a player runs, not
      # archives they have to unpack, and not a support kit beside it. If a third asset ever appears here it is either
      # a mistake or a decision, and this makes it a decision.
      - name: Confirm the release is binaries only
        run: |
          set -eu
          ls -l
          for f in *; do
            case "$f" in
              u2port-linux-x86_64 | u2port-windows-x86_64.exe) ;;
              *) echo "refusing to publish: $f is not one of the two binaries" >&2; exit 1 ;;
            esac
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            u2port-linux-x86_64
            u2port-windows-x86_64.exe
          body: |
            Early, and honest about it. The port reaches the title screen, the game menu and the overworld. Character
            creation does not work, `Esc` or `Q` ends the run, and what is broken is listed with the observation that
            found each one: [`docs/port-defects.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/port-defects.md).

            ## You still need the game

            Nothing here is the game and nothing here ever will be: no disc image, no `ENCHANT.EXP`, no ROM, no
            extracted asset. Ultima II on FM Towns is still in copyright with no legal way to buy it, so this is a
            non-commercial preservation effort aimed at people who already own it. If you hold rights to it and want
            this taken down, open an issue and it happens.

            ## The binaries

            `u2port-linux-x86_64`, sha256 `${{ needs.host.outputs.sha256 }}`. **This one plays.** One file, no archive
            to unpack: put your own copy of the disc image beside it and run it. It reads `ENCHANT.EXP`, TBIOS, the
            graphics, the sounds and the kanji font out of that image, keeps what it reads under `extracted/`, and
            creates `saves/` for characters as plain files, so the image is optional after a first run. At the game
            menu pick *Journey Onward*, or *Generate Character* to make one. `u2port-linux-x86_64 --licences` prints
            every licence and provenance notice compiled into it. SDL is linked statically from the pinned upstream release, so there is
            no `libSDL3` to install and nothing to apt first: the binary's whole dynamic list is libc, libstdc++, libm
            and libgcc. What SDL loads at run time is the desktop's own (X11 or Wayland, GL, and one of ALSA, Pulse or
            PipeWire), and the binary was checked on a bare Debian trixie container with no SDL installed at all,
            where it mapped a 640x480 window and drew the title screen.

            `u2port-windows-x86_64.exe`, sha256 `${{ needs.windows.outputs.sha256 }}`. The same program for Windows,
            cross-built with mingw-w64 and statically linked, so its import table is Windows' own libraries and no DLL
            travels with it. **It has never been run on a real Windows machine**, because this project has no access to
            one. Every check it has is from Wine: it starts there, prints its licences, and draws frames byte-identical
            to the Linux build's at 700 and at 5,800 frames. Wine is a proxy and not the thing itself, so treat this as
            an untested build that is likely to work rather than a supported one, and a failure on real hardware is the
            most useful report you can send.

            Neither file is an archive, and nothing else is published here: the licence texts and the glyph ROM's
            provenance are compiled into both binaries, and `--licences` prints them.

            ## The image

            `ghcr.io/${{ github.repository }}:port-latest` (also tagged `port-${{ github.ref_name }}`). A toolchain
            and a display rather than a game: Debian trixie with a C++20 compiler, the header packages SDL needs to
            build from source, python, node and a virtual display, serving the port's window over noVNC. It is also
            the from-source route, for regenerating the recompiled module:

            ```bash
            git clone https://github.com/${{ github.repository }}
            cd $(basename ${{ github.repository }})
            git submodule update --init fmtownskit
            # unpack your copy of the game into ./game/, then:
            IMAGE=ghcr.io/${{ github.repository }}:port-latest ./tools/x-run.sh start
            ```

            Open `http://<host>:6081/vnc.html`.

            ## What is in git that was not before

            `module/`: the recompiled C++, 331 generated sources, the game and its TBIOS layer translated from machine
            code into something a person can read and diff. That is the artefact this project exists to preserve. Its
            provenance, its regeneration command, and the measurement showing it holds code rather than media are in
            [`module/README.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/module/README.md).
            The originals are still excluded by `.gitignore`, by `tools/precommit-guard.sh`, and by the checks in
            `tools/verify.js` and `tools/portcheck.js`.
