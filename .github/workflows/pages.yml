# Deploy the save disk editor to GitHub Pages.
#
# This repository holds the whole Ultima II FM Towns project: extraction tools,
# findings, container definitions and the browser editor. Only the editor is
# published, and it lives in web/, so the artefact path points there rather than
# at the repository root. Nothing else needs a build step.
name: Deploy editor to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
