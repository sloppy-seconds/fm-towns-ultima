# Deploy the save disk editor and the documentation to GitHub Pages.
#
# Two things get published from one repo:
#
#   /          the browser save-disk editor, served from web/ as static files
#   /docs/     the MkDocs site built from docs/
#
# They are assembled into a single artefact rather than using two deployments,
# because Pages serves one site per repo. The editor keeps the root path it has
# always had, so existing links to it still work.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned so a theme release cannot change the site silently. Bump
      # deliberately, checking the result.
      - name: Install MkDocs
        run: pip install 'mkdocs-material==9.*'

      - name: Build docs
        run: mkdocs build --strict

      # Assemble the artefact. The editor goes to the root, the built docs go
      # under /docs/. site_dir in mkdocs.yml points at _site/docs so this is a
      # straight copy rather than a rename.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          test -f _site/index.html
          test -f _site/docs/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
