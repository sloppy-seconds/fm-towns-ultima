# The repo README is the front door on GitHub, not part of the site, so it is
# referenced but not built. Edit `docs/index.md` for the site homepage.
exclude_docs: |
  README.md

# Explicit links, so the repo is reachable from the footer and on mobile where
# the header icon is hidden.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sloppy-seconds/fm-towns-ultima
      name: Source on GitHub
    - icon: material/language-html5
