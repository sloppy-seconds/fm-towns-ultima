site_name: Ultima Trilogy FM Towns
site_description: Playing and taking apart Ultima Trilogy 1-3 on the FM Towns
site_author: Paul Czarkowski
docs_dir: docs
site_dir: _site/docs

# The site is published under /docs/ next to the save editor, so the editor
# stays at the root where it has always been and where people link to it.
use_directory_urls: true

# repo_url drives the GitHub icon and repository name in the header, and the
# "edit this page" pencil on every page. Using the theme's own support rather
# than pasting an icon means the mark is Material Design Icons, Apache 2.0.
repo_url: https://github.com/sloppy-seconds/fm-towns-ultima
repo_name: sloppy-seconds/fm-towns-ultima

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# The order here is the order the nav appears in, so it reads as a narrative
# rather than alphabetically. Start with getting it running, then the durable
# findings, then the investigations, then what is still open.
nav:
  - Home: index.md
  - Plan: plan.md
  - Quickstart: quickstart.md
  - Getting set up: setup.md
  - Playing:
      - Running the game and reading the machine: playing-and-environment.md
      - The save disk: save-disk.md
  - The game:
      - Disc and binaries: disc-and-binaries.md
      - Assets and graphics: assets-and-graphics.md
      - Extraction: extraction.md
      - Sound: sound.md
  - Characters:
      - Save files and the roster: save-files.md
      - Roster field reference: roster-reference.md
      - The game text: game-text.md
      - Debug and cheat modes: debug-modes.md
      - The font encoding: font-encoding.md
      - Reference implementations: references.md
      - Testing U3 hypotheses against U2: u3-hypothesis-tests.md
      - Finding functions and structure: function-recovery.md
      - The text renderer: text-renderer.md
      - Where the strings are: string-sources.md
      - Core routines: core-routines.md
      - More core routines: more-routines.md
      - The random number helpers: rng-helpers.md
      - The stat-gain routine: stat-gain.md
      - The shrine function: shrine-function.md
      - The randMod function groups: randmod-groups.md
      - The character record layout: record-layout.md
      - Testing whether code writes 0xEB: glyph-writer-test.md
      - Searching for the glyph bitmaps: glyph-bitmap-search.md
      - The randMod survey: randmod-survey.md
      - The A12 disassembler design: a12-design.md
      - The 0x101a20 entry question: entry-point-question.md
      - The control-flow walk: cfgwalk.md
      - The indirect branches: indirect-branches.md
      - Ghidra viability: ghidra-viability.md
      - Record arrays: record-arrays.md
      - The EB glyph set: eb-glyphs.md
      - Addressing limits: addressing-limits.md
      - The runtime image: runtime-image.md
      - The two-state overlay test: overlay-test.md
      - The top region is mirrored: mirrored-region.md
      - Re-running the reference searches: a9-reference-search.md
      - Map geometry: map-geometry.md
      - The cell encoding: cell-encoding.md
      - Status of the open items: open-status.md
      - Equipment thresholds: equipment-thresholds.md
      - The tile loader: tile-loader.md
      - Reviewing the research doc: meta-analysis-review.md
      - Differences from published references: rebuttal.md
      - What the research doc is useful for: meta-analysis-uses.md
      - World save format: world-format.md
  - Colour:
      - The palette: palette.md
  - Where it stands:
      - Reading the code: code-analysis.md
      - Open questions: open-questions.md
      - How this was made: provenance.md

# The repo README is the front door on GitHub, not part of the site, so it is
# referenced but not built. Edit `docs/index.md` for the site homepage.
exclude_docs: |
  README.md

# Explicit links, so the repo is reachable from the footer and on mobile where
# the header icon is hidden.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sloppy-seconds/fm-towns-ultima
      name: Source on GitHub
    - icon: material/language-html5
      link: https://sloppy-seconds.github.io/fm-towns-ultima/
      name: Save game editor
